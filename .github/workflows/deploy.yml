name: Deploy to Cloudflare Pages

# Pull requests get a preview URL; pushes to main deploy to production.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: infrazz-web
  WRANGLER: npx --yes wrangler@4.151.3

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate public/ for Pages
        run: $WRANGLER pages project validate public

      - name: Check pages reference existing local files
        run: |
          status=0
          for f in $(find public -name '*.html'); do
            for ref in $(grep -oE '(href|src)="/[^"#?]*' "$f" | sed -E 's/^(href|src)="//'); do
              path="public$ref"
              [ -d "$path" ] && path="$path/index.html"
              [ -e "$path" ] || { echo "::error file=$f::missing $ref"; status=1; }
            done
          done
          exit $status

  deploy:
    needs: check
    # Fork PRs don't get secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Pages project if missing
        run: |
          if ! $WRANGLER pages project list | grep -qw "$PROJECT"; then
            $WRANGLER pages project create "$PROJECT" --production-branch=main
          fi

      - name: Deploy
        id: deploy
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $WRANGLER pages deploy public --project-name="$PROJECT" --branch="$BRANCH" \
            --commit-hash="${{ github.event.pull_request.head.sha || github.sha }}" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview: $URL (commit $SHA)"
